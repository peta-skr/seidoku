# ローカルで動かす PostgreSQL。開発用の seidoku と、テスト用の seidoku_test を持つ
name: seidoku

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: seidoku
      POSTGRES_PASSWORD: seidoku
      POSTGRES_DB: seidoku
    ports:
      # 5432 は手元にインストールした PostgreSQL と重なることがあるので、ずらす
      - "54320:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # 初期化の途中はソケットでしか待ち受けないので、TCP で確かめて初期化の完了を待つ
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U seidoku -d seidoku"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres-data:
